name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Move the major tag (v1 for v1.2.3)
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA" && git push -f origin "$MAJOR"
