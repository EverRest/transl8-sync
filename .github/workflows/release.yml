name: release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
jobs:
  major-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Move the major tag (v1 for v1.2.3)
        run: |
          MAJOR="${GITHUB_REF_NAME%%.*}"
          git tag -f "$MAJOR" "$GITHUB_SHA" && git push -f origin "$MAJOR"
